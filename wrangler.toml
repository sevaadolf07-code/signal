# Cloudflare Workers configuration for Signal Pulse (TanStack Start + Nitro)
# The build (`vite build`) uses Nitro's `cloudflare-module` preset by default
# and emits the Worker to `.output/server/index.mjs` with static assets in
# `.output/public/`. Wrangler serves them together.

name = "signal-pulse"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Serve static assets (JS/CSS/images) generated by the build.
[assets]
directory = ".output/public"
binding = "ASSETS"

# Public (non-secret) build/runtime env. Secrets go via `wrangler secret put`.
[vars]
# SUPABASE_URL = "https://<your-project-ref>.supabase.co"
# SUPABASE_PUBLISHABLE_KEY = "sb_publishable_..."